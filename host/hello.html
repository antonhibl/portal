<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Portal</title>
		<link rel="icon" type="image/png" sizes="32x32" href="assets/portal-32.png">
		<link rel="icon" type="image/png" sizes="64x64" href="assets/portal-64.png">
		<style>
		:root {
			color-scheme: light dark;
			font-family: system-ui, sans-serif;
		}
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
		}
		main {
			padding: 2rem;
			text-align: center;
		}
		h1 {
			font-size: clamp(2rem, 8vw, 4rem);
			letter-spacing: -0.05em;
			margin: 0;
		}
		p {
			opacity: 0.65;
			line-height: 1.6;
		}
		</style>
	</head>
	<body>
		<main>
			<img
				src="assets/portal-256.png"
				alt="Portal Companion Buffer"
				width="128"
				height="128"
			>
			<h1>Hello, world!</h1>
			<p>Welcome to Portal.</p>
		</main>
		<script>
		document.title = "Hello, world!";
		</script>
	</body>
</html>
